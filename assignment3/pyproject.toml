[build-system]
requires = [
    "setuptools",
    # 4110 only:
    # "cython",
    # "numpy==1.21.*",
]
build-backend = "setuptools.build_meta"

[project]
version = "0.1.0"
requires-python = ">=3.7"
license = {text = "MIT License"}
name = "instapy"
description = "A package that turns your images into nostalgic memories."
readme = "README.md"
dependencies = [
    "numpy",
    "Pillow",
    "numba",
    "line_profiler"
]


